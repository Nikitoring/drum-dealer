services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drum_dealer}
      POSTGRES_USER: ${POSTGRES_USER:-drum_dealer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drum_dealer} -d ${POSTGRES_DB:-drum_dealer}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
