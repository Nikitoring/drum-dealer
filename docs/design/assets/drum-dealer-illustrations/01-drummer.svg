<svg xmlns="http://w3.org" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Текстура старой бумаги для эффекта плаката -->
    <filter id="poster-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Задний план (Кумачовый красный) -->
  <rect width="500" height="700" fill="#D32F2F" />

  <!-- Лучи солнца (символ светлого будущего) -->
  <g fill="#FBC02D" opacity="0.15">
    <polygon points="250,380 0,0 60,0" />
    <polygon points="250,380 140,0 210,0" />
    <polygon points="250,380 290,0 360,0" />
    <polygon points="250,380 440,0 500,0" />
    <polygon points="250,380 500,90 500,170" />
    <polygon points="250,380 500,270 500,360" />
    <polygon points="250,380 500,480 400,700" />
    <polygon points="250,380 270,700 170,700" />
    <polygon points="250,380 50,700 0,640" />
    <polygon points="250,380 0,490 0,390" />
    <polygon points="250,380 0,240 0,140" />
  </g>

  <!-- ГЕОМЕТРИЧЕСКИЙ СИЛУЭТ ПИОНЕРА -->
  <g id="pioneer">
    <!-- Рубашка (белая, плакатный стиль) -->
    <polygon points="200,420 300,420 340,550 160,550" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />

    <!-- Шея -->
    <polygon points="225,370 275,370 270,420 230,420" fill="#F5CBA7" stroke="#1A1A1A" stroke-width="4" />

    <!-- Пионерский галстук (развевающийся) -->
    <g fill="#E53935" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round">
      <!-- Узел -->
      <polygon points="240,420 260,420 255,435 245,435" fill="#B71C1C" />
      <!-- Левый конец -->
      <polygon points="240,425 140,450 160,480 245,435" />
      <!-- Правый конец -->
      <polygon points="260,425 360,440 330,475 255,435" />
    </g>

    <!-- Лицо (профиль/полуанфас, устремленный вверх взгляд) -->
    <path d="M225,300 C225,260 275,260 275,300 C275,340 270,370 270,370 L230,370 Z" fill="#F5CBA7" stroke="#1A1A1A" stroke-width="4" />

    <!-- Пилотка -->
    <path d="M220,285 L250,230 L280,280 L250,270 Z" fill="#E53935" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
    <polygon points="230,275 250,245 270,272" fill="#B71C1C" />
    <!-- Звездочка на пилотке -->
    <polygon points="250,253 252,258 257,258 253,261 255,266 250,263 245,266 247,261 243,258 248,258" fill="#FBC02D" />

    <!-- Волосы -->
    <path d="M225,290 C230,280 245,275 255,275 C265,275 275,280 275,295 C270,290 265,290 260,295 C250,290 240,295 225,290 Z" fill="#212121" />

    <!-- Глаза, брови, рот (соцреализм, волевые черты) -->
    <path d="M245,290 L260,292" stroke="#212121" stroke-width="3" stroke-linecap="round" />
    <path d="M248,298 A4,4 0 0,1 258,299" fill="none" stroke="#212121" stroke-width="3" />
    <path d="M245,315 Q255,325 265,315" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
  </g>

  <!-- БАРАБАН -->
  <g id="drum">
    <!-- Ремень через плечо -->
    <polygon points="175,420 195,420 290,550 270,550" fill="#212121" />

    <!-- Корпус барабана -->
    <rect x="120" y="500" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5" />

    <!-- Красные канты барабана -->
    <rect x="120" y="500" width="260" height="20" fill="#E53935" stroke="#1A1A1A" stroke-width="4" />
    <rect x="120" y="620" width="260" height="20" fill="#E53935" stroke="#1A1A1A" stroke-width="4" />

    <!-- Зигзагообразные веревки на корпусе -->
    <polyline points="130,520 150,620 170,520 190,620 210,520 230,620 250,520 270,620 290,520 310,620 330,520 350,620 370,520" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- РУКИ И БАРАБАННЫЕ ПАЛОЧКИ -->
  <g id="hands-and-sticks">
    <!-- Левая палочка -->
    <line x1="100" y1="440" x2="190" y2="510" stroke="#FBC02D" stroke-width="8" stroke-linecap="round" />
    <circle cx="190" cy="510" r="6" fill="#FBC02D" />
    <!-- Левая рука -->
    <path d="M100,450 Q120,430 150,450" fill="none" stroke="#F5CBA7" stroke-width="14" stroke-linecap="round" />

    <!-- Правая палочка (занесенная вверх) -->
    <line x1="400" y1="430" x2="310" y2="495" stroke="#FBC02D" stroke-width="8" stroke-linecap="round" />
    <circle cx="310" cy="495" r="6" fill="#FBC02D" />
    <!-- Правая рука -->
    <path d="M400,440 Q380,420 340,445" fill="none" stroke="#F5CBA7" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- СТРОГИЙ СОВЕТСКИЙ ШРИФТ И ТЕКСТ -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Тень для текста -->
    <text x="253" y="83" font-size="52" fill="#1A1A1A" letter-spacing="4">ВСТУПАЙ!</text>
    <text x="250" y="80" font-size="52" fill="#FFFFFF" letter-spacing="4">ВСТУПАЙ!</text>

    <text x="252" y="142" font-size="34" fill="#1A1A1A" letter-spacing="2">В РЯДЫ ПИОНЕРОВ</text>
    <text x="250" y="140" font-size="34" fill="#FBC02D" letter-spacing="2">В РЯДЫ ПИОНЕРОВ</text>
  </g>

  <!-- Наложение текстуры плаката -->
  <rect width="500" height="700" fill="none" filter="url(#poster-texture)" opacity="0.3" style="mix-blend-mode: multiply;" />
</svg>
