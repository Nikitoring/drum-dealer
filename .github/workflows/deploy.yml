name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runner
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/drum-dealer-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: migrate
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/drum-dealer-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: ghcr.io/${{ steps.owner.outputs.value }}/drum-dealer-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/drum-dealer/deploy/nginx"
          scp -P "$PORT" docker-compose.production.yml "$VPS_USER@$VPS_HOST:/opt/drum-dealer/"
          scp -P "$PORT" deploy/nginx/default.conf "$VPS_USER@$VPS_HOST:/opt/drum-dealer/deploy/nginx/"
          scp -P "$PORT" deploy/env.production.example "$VPS_USER@$VPS_HOST:/opt/drum-dealer/deploy/"
          scp -P "$PORT" deploy/create-admin.js "$VPS_USER@$VPS_HOST:/opt/drum-dealer/deploy/"

      - name: Login to GHCR on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          PORT="${VPS_PORT:-22}"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Apply migrations and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.image_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PORT="${VPS_PORT:-22}"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' sh -s" <<'REMOTE'
          set -eu

          cd /opt/drum-dealer
          test -f .env.production

          TMP_FILE="$(mktemp)"
          grep -vE '^(GHCR_OWNER|IMAGE_TAG)=' .env.production > "$TMP_FILE" || true
          printf 'GHCR_OWNER=%s\nIMAGE_TAG=%s\n' "$GHCR_OWNER" "$IMAGE_TAG" >> "$TMP_FILE"
          chmod 600 "$TMP_FILE"
          mv "$TMP_FILE" .env.production

          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production -f docker-compose.production.yml pull
          docker compose --env-file .env.production -f docker-compose.production.yml run --rm migrate
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
          docker image prune -f
          REMOTE
